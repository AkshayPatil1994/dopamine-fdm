name: Sync docs to Wiki

on:
  push:
    branches:
      - dev
    paths:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH for wiki deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WIKI_DEPLOY_KEY }}" > ~/.ssh/wiki_deploy_key
          chmod 600 ~/.ssh/wiki_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          echo "Key fingerprint (verify this matches the deploy key on GitHub):"
          ssh-keygen -lf ~/.ssh/wiki_deploy_key.pub 2>/dev/null || ssh-keygen -y -f ~/.ssh/wiki_deploy_key | ssh-keygen -lf /dev/stdin
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/wiki_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Clone wiki
        run: |
          git clone "git@github.com:${{ github.repository }}.wiki.git" wiki

      - name: Sync docs into wiki
        run: |
          rsync -av --delete --exclude '.git' docs/ wiki/

      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to wiki."
            exit 0
          fi
          git commit -m "Sync wiki from docs/ (${{ github.sha }})"
          git push
